services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: yt-anomaly-bot
    restart: unless-stopped
    profiles: ["telegram"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks: [bot-network]

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: yt-anomaly-web
    restart: unless-stopped
    command: ["python", "run_web.py", "--host", "0.0.0.0", "--port", "8000"]
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    networks: [bot-network]

  postgres:
    image: postgres:16-alpine
    container_name: yt-anomaly-postgres
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ytbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-yt_anomaly_bot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ytbot} -d ${POSTGRES_DB:-yt_anomaly_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [bot-network]

networks:
  bot-network:
    driver: bridge
volumes:
  postgres_data:
